# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx8G -Djava.net.preferIPv4Stack=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 网络优化（国内网络环境）：
# - preferIPv4Stack：避免 IPv6 路径丢包导致 TLS 握手中断（curl 可通而 Gradle 失败的根因）
# - 拉长 HTTP 超时并开启重试，容忍不稳定的跨境连接
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=5

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.207
neo_version_range=[21.1.0,)
# NeoForge 的 loader 版本为 2.x；若写成 [4,) 会被 ModDiscoverer 判定为 Forge 模组而跳过加载
loader_version_range=[2,)

# Mod metadata
mod_id=compactextremereactor
mod_name=Compact Extreme Reactor
mod_license=MIT
mod_version=1.0.0-beta3
mod_group_id=com.compact.extremereactor
mod_authors=Compact Extreme Reactor
mod_description=Compresses Extreme Reactors multiblock machines (Reactor, Turbine) into single compact blocks.

# Local dependency jars (downloaded from Modrinth, maven.zerono.it is unreachable)
er_version=1.21.1-2.4.9
zerocore_version=1.21.1-2.4.9
