// ============================================================
// Compact Extreme Reactor - Stonecutter 中央构建脚本
// 当前版本属性由 Stonecutter 从 versions/<mc>/gradle.properties 注入：
//   platform            : neoforge | legacyforge
//   minecraft_version   : 1.21.1 | 1.20.1
//   neo_version         : NeoForge 版本（1.21.1）
//   neoforge_version    : Forge 版本（1.20.1，legacyforge 插件使用）
//   java_version        : 21 | 17
//   er_version/zerocore_version : 本地 libs 依赖版本
// ============================================================
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    // 两个 loader 插件都声明但不自动应用，运行时按 platform 分支 apply
    id 'net.neoforged.moddev' version '2.0.140' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.140' apply false
}

def mcVersion = (findProperty('minecraft_version') ?: '1.21.1') as String
def platform = (findProperty('platform') ?: 'neoforge') as String
// jar 文件名中的加载器标签（1.20.1 分支为 Forge，1.21.1 分支为 NeoForge）
def loaderLabel = platform == 'neoforge' ? 'NeoForge' : 'Forge'
// Stonecutter 0.8：版本子项目 projectDir = versions/<mc>，因此所有根级路径必须经 rootProject 定位
def versionedDir = rootProject.file("versions/${mcVersion}")

version = findProperty('mod_version') ?: '1.0.0-beta4'
group = findProperty('mod_group_id') ?: 'com.compact.extremereactor'

base {
    archivesName = findProperty('mod_id') ?: 'compactextremereactor'
}

// 统一产物命名：<modid>-<version>-<Loader>-<MC版本>.jar
// 例：compactextremereactor-1.0.0-beta4-Forge-1.20.1.jar / -NeoForge-1.21.1.jar
def versionedJarName = "${findProperty('mod_id') ?: 'compactextremereactor'}-" +
        "${findProperty('mod_version') ?: '1.0.0-beta4'}-" +
        "${loaderLabel}-${mcVersion}.jar"
tasks.named('jar', Jar) {
    archiveFileName.set(versionedJarName)
}
// legacyforge 平台的最终产物是 reobfJar（重混淆 jar），同样采用统一命名。
// reobfJar 由 legacyforge 插件延迟创建，必须用惰性匹配配置（matching + configureEach）
tasks.matching { it.name == 'reobfJar' }.configureEach {
    archiveFileName.set(versionedJarName)
}

java.toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)

repositories {
    mavenLocal()
    mavenCentral()
}

// 版本特有源码与资源：Stonecutter 子项目 projectDir = versions/<mc>，
// 默认源目录（src/main/java、src/main/resources）天然指向版本源码，无需显式声明
// 数据生成输出（与资源合并进 jar）
sourceSets.main.resources.srcDir 'src/generated/resources'

// 重配仓库：moddev/legacyforge apply 时会自动添加官方仓库（maven.neoforged.net、
// libraries.minecraft.net）。官方源优先（代理可直连），不可达的域名用镜像兜底：
//   bmclapi2.bangbang93.com = libraries.minecraft.net 镜像（该域名代理不可达，必须走镜像）
//   neoforged.forgecdn.net = maven.neoforged.net / mojang-meta 的同步镜像
// 注意：libraries.minecraft.net 即使开代理也无法访问，BMCLAPI 镜像不可移除
def configureRepositories() {
    repositories {
        repositories.clear()
        mavenLocal()
        // Aliyun Maven Central 镜像排在 mavenCentral() 之前：repo1.maven.org 直连极慢，
        // 国内网络下会导致 createMinecraftArtifacts 拉依赖长时间卡住，镜像可 20MB/s 高速下载
        maven {
            name = 'Aliyun Maven Central Mirror'
            url = 'https://maven.aliyun.com/repository/central'
        }
        mavenCentral()
        // ForgeCDN 镜像优先：maven.neoforged.net 直连 SSL 握手不稳定，国内环境经常 Connection reset，
        // neoforged.forgecdn.net 是 neoforged.net 的同步镜像，国内可直连，能完全覆盖官方仓库内容
        maven {
            name = 'NeoForged Mirror'
            url = 'https://neoforged.forgecdn.net/releases'
        }
        // 注意：maven.neoforged.net 官方仓库在国内环境 SSL 连接会被重置（SocketException），
        // 每次失败要重试多次造成构建长时间卡住，故不加入仓库列表，全部走 forgecdn.net 镜像
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'BMCLAPI Minecraft Libraries'
            url = 'https://bmclapi2.bangbang93.com/maven'
        }
        maven {
            name = 'NeoForged MojangMeta Mirror'
            url = 'https://neoforged.forgecdn.net/mojang-meta'
        }
    }
}

// ============================================================
// 平台分支：NeoForge 1.21.1 / Forge 1.20.1（moddev legacyforge）
// ============================================================
if (platform == 'neoforge') {
    apply plugin: 'net.neoforged.moddev'
    configureRepositories()

    neoForge {
        version = findProperty('neo_version')

        runs {
            client {
                client()
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            gameTestServer {
                type = "gameTestServer"
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            data {
                data()
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
} else {
    apply plugin: 'net.neoforged.moddev.legacyforge'
    configureRepositories()

    legacyForge {
        validateAccessTransformers = true

        enable {
            neoForgeVersion = findProperty('neoforge_version')
        }

        runs {
            client {
                client()
            }
            server {
                server()
            }
            data {
                data()
            }
        }

        mods {
            register(mod_id as String) {
                sourceSet(sourceSets.main)
            }
        }
    }
}

// ============================================================
// 本地依赖：Extreme Reactors 与 ZeroCore 2 的发布版 jar
// （maven.zerono.it 官方 Maven 仓库不可达，故从 Modrinth 下载放入 libs/ 目录）
// ============================================================
dependencies {
    // rootProject.file：libs/ 位于仓库根目录，而子项目 projectDir 在 versions/<mc>/
    implementation files(
            rootProject.file("libs/ExtremeReactors2-${findProperty('er_version')}.jar"),
            rootProject.file("libs/ZeroCore2-${findProperty('zerocore_version')}.jar")
    )
}

// 将本地依赖 mod 复制到 dev 运行目录的 mods 文件夹，确保开发环境中 ER/ZeroCore 被正常加载
// 只复制当前版本对应的 jar，避免误带其他版本依赖
tasks.register('copyLocalMods', Copy) {
    from(rootProject.file('libs')) {
        include "ExtremeReactors2-${findProperty('er_version')}.jar"
        include "ZeroCore2-${findProperty('zerocore_version')}.jar"
    }
    // dev 运行目录位于子项目（versions/<mc>/run），故 run/mods 相对 projectDir
    into file('run/mods')
}

tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer'] }.configureEach {
    dependsOn 'copyLocalMods'
}

// ============================================================
// mods.toml 元数据生成：从当前版本目录的模板展开占位符
// ============================================================
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    // 属性可能在某平台不存在（如 forge_version_range 仅 1.20.1 用），置空避免校验失败
    var replaceProperties = [minecraft_version      : findProperty('minecraft_version'),
                             minecraft_version_range: findProperty('minecraft_version_range'),
                             neo_version            : findProperty('neo_version'),
                             neo_version_range      : findProperty('neo_version_range'),
                             loader_version_range   : findProperty('loader_version_range'),
                             forge_version_range    : findProperty('forge_version_range') ?: '',
                             mod_id                 : findProperty('mod_id'),
                             mod_name               : findProperty('mod_name'),
                             mod_license            : findProperty('mod_license'),
                             mod_version            : findProperty('mod_version'),
                             mod_authors            : findProperty('mod_authors'),
                             mod_description        : findProperty('mod_description')]
    // Gradle 9 不允许属性值为 null：剔除当前平台不存在的属性（如 1.20.1 无 neo_version）
    replaceProperties = replaceProperties.findAll { it.value != null }
    inputs.properties replaceProperties
    expand replaceProperties
    from "${versionedDir}/src/main/templates"
    into "build/generated/sources/modMetadata"
}

// 将生成的 mods.toml 并入资源，并在 IDE 同步时自动运行
sourceSets.main.resources.srcDir generateModMetadata
if (platform == 'neoforge') {
    neoForge.ideSyncTask generateModMetadata
} else {
    legacyForge.ideSyncTask generateModMetadata
}

// ============================================================
// 发布配置
// ============================================================
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ============================================================
// 国内网络修复：NeoGradle 插件在 afterEvaluate 阶段自动追加
// maven.neoforged.net 官方仓库，但该域名在国内 SSL 连接经常被重置
// （Connection reset），每次失败重试 8 次，导致每个依赖都卡住 10+ 秒。
// 这里在 afterEvaluate 中将其移除，依赖全部走 forgecdn.net 镜像。
// ============================================================
gradle.projectsLoaded { g ->
    g.allprojects { p ->
        p.afterEvaluate {
            p.repositories.removeIf { repo ->
                repo instanceof MavenArtifactRepository &&
                repo.url.toString().contains('maven.neoforged.net')
            }
        }
    }
}
